name: Setup Environment

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  setup-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create .env.local from GitHub Secrets
        run: |
          cat > .env.local << EOF
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          YAHOO_AUTH_URL=${{ secrets.YAHOO_AUTH_URL }}
          YAHOO_TOKEN_URL=${{ secrets.YAHOO_TOKEN_URL }}
          YAHOO_CLIENT_ID=${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET=${{ secrets.YAHOO_CLIENT_SECRET }}
          EOF
        # NOTE: YAHOO_CALLBACK_URL is intentionally omitted here.
        # It is automatically derived at runtime by lib/get-callback-url.ts
        # from NEXTAUTH_URL (or VERCEL_PROJECT_PRODUCTION_URL or VERCEL_URL).
        #
        # NOTE: NEXTAUTH_URL is intentionally omitted here for Vercel deployments.
        # It is automatically bootstrapped at runtime in pages/api/auth/[...nextauth].ts
        # from VERCEL_PROJECT_PRODUCTION_URL (production) or VERCEL_URL (preview).
        # For non-Vercel production deployments, set NEXTAUTH_URL as a GitHub Secret.

      - name: Set NEXTAUTH_URL for preview deployments
        if: github.event_name == 'pull_request' && env.VERCEL_URL != ''
        run: |
          # For preview deployments, if NEXTAUTH_URL is not explicitly set in secrets,
          # we can rely on the dynamic NEXTAUTH_URL bootstrap in the NextAuth config
          # which will use VERCEL_URL when available (https:// is prepended automatically).
          echo "Preview deployment detected. NEXTAUTH_URL will be dynamically bootstrapped using VERCEL_URL"

      - name: Verify .env.local was created with all required variables
        run: |
          if [ ! -f .env.local ]; then
            echo "❌ ERROR: .env.local was not created"
            exit 1
          fi
          
          echo "✅ .env.local created successfully"
          echo ""
          echo "Environment variables set:"
          grep -v "^$" .env.local | cut -d= -f1 | sort
          echo ""
          
          # Verify that NEXTAUTH_SECRET is not empty
          if grep -q "^NEXTAUTH_SECRET=$" .env.local; then
            echo "❌ ERROR: NEXTAUTH_SECRET is empty in .env.local"
            echo "This is a required variable for the build to succeed."
            exit 1
          fi
          
          if ! grep -q "^NEXTAUTH_SECRET=" .env.local; then
            echo "❌ ERROR: NEXTAUTH_SECRET is not set in .env.local"
            echo "This is a required variable for the build to succeed."
            exit 1
          fi
          
          echo "✅ NEXTAUTH_SECRET is properly set"

      - name: Validate environment variables at build time
        run: |
          echo "🔍 Validating required environment variables..."
          
          # Check for NEXTAUTH_SECRET (required for build-time validation)
          if [ -z "${{ secrets.NEXTAUTH_SECRET }}" ]; then
            echo "❌ ERROR: NEXTAUTH_SECRET is not set in GitHub Secrets"
            echo "This variable is REQUIRED for the build to succeed."
            echo "Please add NEXTAUTH_SECRET to your GitHub Secrets:"
            echo "  1. Go to Settings > Secrets and variables > Actions"
            echo "  2. Click 'New repository secret'"
            echo "  3. Name: NEXTAUTH_SECRET"
            echo "  4. Value: Generate with 'openssl rand -base64 32'"
            exit 1
          fi
          
          echo "✅ NEXTAUTH_SECRET is set in GitHub Secrets"
          
          # Check for recommended variables
          if [ -z "${{ secrets.YAHOO_CLIENT_ID }}" ]; then
            echo "⚠️  WARNING: YAHOO_CLIENT_ID is not set in GitHub Secrets"
          else
            echo "✅ YAHOO_CLIENT_ID is set"
          fi
          
          if [ -z "${{ secrets.YAHOO_CLIENT_SECRET }}" ]; then
            echo "⚠️  WARNING: YAHOO_CLIENT_SECRET is not set in GitHub Secrets"
          else
            echo "✅ YAHOO_CLIENT_SECRET is set"
          fi
          
          echo ""
          echo "✅ Pre-build environment validation passed!"

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build
